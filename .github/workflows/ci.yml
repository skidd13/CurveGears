name: CurveGears CI shared

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base_validate:
    name: Base validation
    runs-on: ubuntu-22.04
    outputs:
      family_matrix: ${{ steps.family_matrix.outputs.families || '[]' }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad ripgrep xvfb libgl1-mesa-dri libglu1-mesa
      - name: Export family matrix from Make
        id: family_matrix
        run: echo "families=$(make -s ci-family-matrix)" >> "$GITHUB_OUTPUT"
      - name: Build tooling checks
        run: make test-build-tools
      - name: Shared regressions
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=common OPENSCAD=openscad
      - name: Compile examples and render boundary matrix (core)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make ci-check-examples group=core OPENSCAD=openscad

  family_validate:
    name: Family validation (${{ matrix.family }})
    needs: base_validate
    if: ${{ needs.base_validate.result == 'success' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: ${{ fromJSON(needs.base_validate.outputs.family_matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad ripgrep xvfb libgl1-mesa-dri libglu1-mesa
      - name: Regression (${{ matrix.family }})
        env:
          REGRESSION_FAMILY: ${{ matrix.family }}
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family="$REGRESSION_FAMILY" OPENSCAD=openscad
      - name: Compile family examples and render boundary matrix (${{ matrix.family }})
        env:
          EXAMPLE_GROUP: ${{ matrix.family }}
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make ci-check-examples group="$EXAMPLE_GROUP" OPENSCAD=openscad

  common_end_check:
    name: Common end check
    if: ${{ always() }}
    needs: [base_validate, family_validate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install common end-check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate generated documentation
        run: |
          make check-docs
          git diff --exit-code -- README.md docs examples/README.md tests/README.md
      - name: Check repository hygiene
        run: |
          ! find . \( -path './.git' -o -path './build' \) -prune -o -type f \( -name '*.stl' -o -name '*.csg' -o -name '*.log' \) -print -quit | grep -q .
          ! rg -n '(^|[<"])(\.\./)*.*gears\.scad' src README.md NOTICE.md
      - name: Install OpenSCAD for overview render
        if: ${{ needs.base_validate.result == 'success' && needs.family_validate.result == 'success' }}
        run: sudo apt-get install --yes openscad xvfb libgl1-mesa-dri libglu1-mesa
      - name: Render main overview
        if: ${{ needs.base_validate.result == 'success' && needs.family_validate.result == 'success' }}
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make ci-check-examples group=overview OPENSCAD=openscad
      - name: Require successful validation jobs
        if: ${{ always() && (needs.base_validate.result != 'success' || needs.family_validate.result != 'success' || failure()) }}
        run: exit 1
