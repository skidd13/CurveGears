name: CurveGears CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad ripgrep xvfb libgl1-mesa-dri libglu1-mesa
      - name: Verify regression step coverage
        run: |
          diff -u <(make ci-regression-groups) <(sed -n 's/^      - name: Regression //p' .github/workflows/ci.yml)
      - name: Regression common_math
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=common_math OPENSCAD=openscad
      - name: Regression tooth_generation
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=tooth_generation OPENSCAD=openscad
      - name: Regression tooth_placement
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=tooth_placement OPENSCAD=openscad
      - name: Regression mate_motion
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=mate_motion OPENSCAD=openscad
      - name: Regression bezier
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=bezier OPENSCAD=openscad
      - name: Regression cassini
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=cassini OPENSCAD=openscad
      - name: Regression circle
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=circle OPENSCAD=openscad
      - name: Regression cusp
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=cusp OPENSCAD=openscad
      - name: Regression ellipse
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=ellipse OPENSCAD=openscad
      - name: Regression epitrochoid
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=epitrochoid OPENSCAD=openscad
      - name: Regression fourier
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=fourier OPENSCAD=openscad
      - name: Regression hypotrochoid
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=hypotrochoid OPENSCAD=openscad
      - name: Regression lobed
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=lobed OPENSCAD=openscad
      - name: Regression logarithmic_spiral
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=logarithmic_spiral OPENSCAD=openscad
      - name: Regression pascal
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=pascal OPENSCAD=openscad
      - name: Regression superformula
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" make test family=superformula OPENSCAD=openscad
      - name: Validate generated documentation
        run: |
          make readme
          git diff --exit-code -- README.md
          make check-docs
      - name: Render CI-size examples
        run: |
          make ci-example-manifest
          while IFS=$'\t' read -r example output; do
            mkdir -p "$(dirname "$output")"
            xvfb-run -a --server-args="-screen 0 1280x1024x24" openscad -o "$output" \
              --camera=0,0,0,50,0,40,0 --colorscheme=Nature \
              --projection=o --viewall --autocenter --imgsize=256,256 -q "$example"
            test -s "$output"
          done < build/ci-images/manifest.tsv
      - name: Check repository hygiene
        run: |
          ! find . \( -path './.git' -o -path './build' \) -prune -o -type f \( -name '*.stl' -o -name '*.csg' -o -name '*.log' \) -print -quit | grep -q .
          ! rg -n '(^|[<"])(\.\./)*.*gears\.scad' src README.md NOTICE.md
