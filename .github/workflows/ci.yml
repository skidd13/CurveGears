name: CurveGears CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad ripgrep xvfb libgl1-mesa-dri libglu1-mesa
      - name: Regression tests
        run: |
          failed=0
          echo '## Regression group results' >> "$GITHUB_STEP_SUMMARY"
          for family in $(make ci-regression-groups); do
            if xvfb-run -a --server-args="-screen 0 1280x1024x24" make test FAMILY="$family" OPENSCAD=openscad; then
              echo "- [x] `$family`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- [ ] `$family` — failed" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
      - name: Validate generated documentation
        run: |
          make readme
          git diff --exit-code -- README.md
          make check-docs
      - name: Render CI-size examples
        run: |
          make ci-example-manifest
          while IFS=$'\t' read -r example output; do
            mkdir -p "$(dirname "$output")"
            xvfb-run -a --server-args="-screen 0 1280x1024x24" openscad -o "$output" \
              --camera=0,0,0,50,0,40,0 --colorscheme=Nature \
              --projection=o --viewall --autocenter --imgsize=256,256 -q "$example"
            test -s "$output"
          done < build/ci-images/manifest.tsv
      - name: Check repository hygiene
        run: |
          ! find . \( -path './.git' -o -path './build' \) -prune -o -type f \( -name '*.stl' -o -name '*.csg' -o -name '*.log' \) -print -quit | grep -q .
          ! rg -n '(^|[<"])(\.\./)*.*gears\.scad' src README.md NOTICE.md
